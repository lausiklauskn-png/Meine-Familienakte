[package]
name = "familienakte"
version = "2.28.15"
description = "Familienakte Pro für Windows"
edition = "2021"
publish = false
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
modelprobe = ["tauri/devtools"]

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
