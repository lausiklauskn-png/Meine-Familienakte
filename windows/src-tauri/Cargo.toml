[package]
name = "familienakte"
version = "2.28.1"
description = "Meine Familienakte für Windows"
edition = "2021"
publish = false
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
