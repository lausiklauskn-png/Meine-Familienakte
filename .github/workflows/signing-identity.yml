name: Dauerhafte Familienakte-Signieridentität

# Klaus 2026-10-28: „bereite den festen Signaturschlüssel vor … so wie immer“ (Vorbild BookLedgerPro, f6633c8).
# initialize: einmal. Erzeugt den Android-Schlüssel nur hier im Lauf, verschlüsselt ihn mit der Freigabe FA_SIGNING_UNLOCK
# (Geheimnis der Umgebung android-production, nur Klaus kennt den Wert), prüft die Wiederherstellung und legt als PR nur das
# verschlüsselte Paket und den öffentlichen Fingerabdruck an. check: jederzeit, grün heißt Freigabe und Schlüssel passen.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Einmalig anlegen oder vorhandene Identität prüfen
        type: choice
        options: [check, initialize]
        default: check
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: familienakte-signing-identity
  cancel-in-progress: false

jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: android-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Proben des Signierwerkzeugs (Wegwerf-Schlüssel, kein echter)
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test tools/signing/test-identity.mjs
      - name: Bestehende Identität und offene Initialisierung schützen
        if: inputs.operation == 'initialize'
        shell: bash
        run: |
          set -euo pipefail
          if test -e signing/android-release.enc.json || test -e signing/android-certificate.json; then
            echo 'Identität bereits vorhanden. Kein neuer Schlüssel wird erzeugt.'; exit 1
          fi
          if test -n "$(git ls-remote origin refs/heads/signing/android-identity)"; then
            echo 'Initialisierung liegt bereits auf signing/android-identity. Diese zuerst prüfen.'; exit 1
          fi
      - name: Eigene Identität einmalig erstellen
        if: inputs.operation == 'initialize'
        env:
          FA_SIGNING_UNLOCK: ${{ secrets.FA_SIGNING_UNLOCK }}
          TMPDIR: ${{ runner.temp }}
        run: node tools/signing/cli.mjs init
      - name: Entschlüsselung und Zertifikatsbindung prüfen
        env:
          FA_SIGNING_UNLOCK: ${{ secrets.FA_SIGNING_UNLOCK }}
          TMPDIR: ${{ runner.temp }}
        run: node tools/signing/cli.mjs check
      - name: Nur verschlüsselte Identität und öffentlichen Fingerabdruck sichern
        if: always() && inputs.operation == 'initialize'
        uses: actions/upload-artifact@v4
        with:
          name: familienakte-encrypted-signing-identity
          path: |
            signing/android-release.enc.json
            signing/android-certificate.json
          if-no-files-found: error
          retention-days: 90
      - name: Verschlüsselte Identität als eigenen PR bereitstellen
        if: inputs.operation == 'initialize'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -c signing/android-identity
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- signing/android-release.enc.json signing/android-certificate.json
          git commit -m 'Dauerhafte Android-Signieridentität verschlüsselt ablegen'
          git push origin HEAD:refs/heads/signing/android-identity
          gh pr create --base main --head signing/android-identity \
            --title 'Dauerhafte Familienakte-Signieridentität' \
            --body 'Enthält ausschließlich die authentifiziert verschlüsselte Signieridentität und den öffentlichen Zertifikatsfingerabdruck. Wiederherstellung im Lauf geprüft. Die Freigabe liegt getrennt im Geheimnis FA_SIGNING_UNLOCK der Umgebung android-production.' \
            || echo 'PR konnte nicht angelegt werden; der Zweig signing/android-identity liegt bereit.'
