name: Kim-sync und Datei-Post – wirklicher Pakettransport
on:
  workflow_dispatch:
  pull_request:
    paths: ['tools/native/test-pro-carriers*', 'app/pro-geraetetransport*', 'app/pro-uebergabe.ts', '.github/workflows/pro-carriers.yml']
permissions:
  contents: read
concurrency:
  group: pro-carriers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  carriers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lausiklauskn-png/Kim-sync
          ref: ab07f046633289aefcc40339caa303661974abf7
          path: work/transport-sources/Kim-sync
      - uses: actions/checkout@v4
        with:
          repository: lausiklauskn-png/Datei-Post
          ref: af29a8d089400477c6a51bf83b5c5c8af43ce160
          path: work/transport-sources/Datei-Post
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Originalpaket über bestehende Verbindung und Empfangsdatei zurück
        run: node tools/native/test-pro-carriers.mjs work/transport-sources/Kim-sync work/transport-sources/Datei-Post
      - name: Fehlenden Schreibnachweis am wirklichen Server erkennen
        run: node tools/native/test-pro-carriers-counter.mjs work/transport-sources/Kim-sync work/transport-sources/Datei-Post
