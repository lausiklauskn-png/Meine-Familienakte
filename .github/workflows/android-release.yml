name: Android-APK veröffentlichen

# Von Hand, nur von main (Klaus 2026-10-28: Test-APK zum Prüfen). Signatur: liegt das Geheimnis
# FA_ANDROID_KEYSTORE_B64 (Base64 eines .jks) mit FA_ANDROID_KEYSTORE_PASSWORD und FA_ANDROID_KEY_ALIAS vor,
# wird damit signiert (dauerhafte Updates). Sonst entsteht eine Test-APK mit einem Wegwerf-Schlüssel dieses
# Laufs: sie lässt sich installieren, aber eine spätere Fassung muss dann neu installiert werden (andere
# Signatur). Kein Schlüssel liegt im Repo.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versions-Tag, etwa android-v2.28.1-test.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tag prüfen
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "Tag $TAG gibt es schon"; exit 1; fi
          version="${TAG#android-v}"; version="${version%%-*}"
          grep -Fq "versionName \"$version\"" android/app/build.gradle || { echo "versionName in android/app/build.gradle ist nicht $version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run check:android
      - name: Web-Paket bauen und in die Hülle legen
        run: npm run sync:android
        env:
          FAMILIENAKTE_COMMIT: ${{ github.sha }}
      - name: Signierschlüssel bereitstellen (Geheimnis oder Wegwerf-Schlüssel)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.FA_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FA_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
            echo "art=dauerhaft" >> "$GITHUB_OUTPUT"
            echo "alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            password=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/signing/release.jks" -storepass "$password" -keypass "$password" -alias familienakte-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Familienakte Test, O=Familienakte, C=DE" >/dev/null 2>&1
            echo "art=wegwerf" >> "$GITHUB_OUTPUT"
            echo "alias=familienakte-test" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$password"
            echo "password=$password" >> "$GITHUB_OUTPUT"
          fi
      - name: Release-APK bauen und signieren
        working-directory: android
        env:
          FAMILIENAKTE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 assembleRelease lintRelease
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/signing/release.jks" --ks-pass "pass:${{ steps.signing.outputs.password }}" --ks-key-alias "${{ steps.signing.outputs.alias }}" --out "$RUNNER_TEMP/Familienakte-${{ inputs.tag }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/Familienakte-${{ inputs.tag }}.apk" | head -5
      - name: Prüfsummen und Hinweise
        id: sums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum "Familienakte-${{ inputs.tag }}.apk" > SHA256SUMS
          cat SHA256SUMS
          {
            echo "Familienakte für Android (Test-APK), Quelle \`${{ github.sha }}\`, Bau ${{ github.run_number }}."
            echo
            echo "Installieren: APK herunterladen, öffnen, Installation aus dieser Quelle erlauben."
            if [ "${{ steps.signing.outputs.art }}" = "wegwerf" ]; then
              echo
              echo "⚠ Signiert mit einem Wegwerf-Schlüssel dieses Laufs: Vor der nächsten Test-APK die alte App deinstallieren (andere Signatur). Für dauerhafte Updates die Geheimnisse FA_ANDROID_KEYSTORE_B64, FA_ANDROID_KEYSTORE_PASSWORD und FA_ANDROID_KEY_ALIAS im Repo hinterlegen (docs/PLATTFORMEN.md)."
            else
              echo
              echo "Signiert mit dem dauerhaften Schlüssel: über die vorhandene App installieren."
            fi
            echo
            echo "SHA-256:"; echo '```'; cat SHA256SUMS; echo '```'
          } > notes.md
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --title "Familienakte Android ${{ inputs.tag }}" --notes-file "$RUNNER_TEMP/notes.md" --prerelease "$RUNNER_TEMP/Familienakte-${{ inputs.tag }}.apk" "$RUNNER_TEMP/SHA256SUMS"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/${{ inputs.tag }}/Familienakte-${{ inputs.tag }}.apk"
