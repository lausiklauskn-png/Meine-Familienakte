name: Familienakte als installierbare PWA (GitHub Pages)

# Teil 2.2: Jeder Merge nach main baut die PWA und liefert sie über GitHub Pages aus
# (Muster: Privat-Brain-Pro/.github/workflows/pages.yml, verkürzt). Die Pages-Quelle muss
# „GitHub Actions“ sein; beim ersten Lauf versucht configure-pages, die Site anzulegen.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nach einer Windows-Veröffentlichung kommen latest.json und der Installer unter windows/ auf die Pages-Adresse,
  # damit die Windows-App über die Versionszeile eine neue Fassung findet (Klaus 2026-10-28).
  workflow_run:
    workflows: ["Windows-Installer veröffentlichen"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - name: PWA bauen (dist mit Service Worker und version.json)
        run: npm run build
        env:
          FAMILIENAKTE_COMMIT: ${{ github.sha }}
      - name: Neueste Windows-Fassung beilegen (windows/latest.json und Installer aus dem Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[].tagName | select(startswith("windows-v"))] | sort_by(. | sub("windows-v";"") | split(".") | map(tonumber)) | last // empty')
          if [ -z "$tag" ]; then echo "Noch keine Windows-Veröffentlichung."; exit 0; fi
          mkdir -p dist/windows
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist/windows --pattern 'latest.json' --pattern '*.exe' --pattern 'SHA256SUMS'
          (cd dist/windows && sha256sum -c SHA256SUMS)
          echo "Windows-Fassung $tag beigelegt:"; cat dist/windows/latest.json
      - name: Vorrat und Bau-Kennung prüfen
        run: |
          set -euo pipefail
          test -f dist/sw.js && test -f dist/version.json && test -f dist/icons/icon-512.png
          node -e "const v=require('./dist/version.json'); const h=require('fs').readFileSync('dist/index.html','utf8'); if(!h.includes('content=\"'+v.build+'\"')) process.exit(1); console.log('Bau', v.build, 'Quelle', v.commit)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7
  veroeffentlichen:
    if: github.repository == 'lausiklauskn-png/Meine-Familienakte'
    needs: bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Öffentlich ausgelieferte Fassung gegen den Bau prüfen
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${PAGE_URL}version.json" -o live.json; then break; fi
            sleep 10
          done
          cat live.json
