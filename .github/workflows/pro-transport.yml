name: Geräteübergabe – Gegenproben
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/pro-geraetetransport*', 'app/pro-uebergabe.ts', 'app/dateiausgabe.ts', 'tests/ui/geraetetransport.test.mjs', 'tests/gegenprobe-sitzung-b.mjs', 'windows/java/**', '.github/workflows/pro-transport.yml']
permissions:
  contents: read
concurrency:
  group: pro-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Zwei getrennte Browserprofile mit echten Dateien und Neustart
        run: node tests/run-ui.mjs geraetetransport
      - name: Absichtliche Verletzungen der Empfangsgrenze erkennen
        run: |
          node tests/gegenprobe-sitzung-b.mjs Gerätetransport:
