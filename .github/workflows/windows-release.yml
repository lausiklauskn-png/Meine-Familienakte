name: Windows-Installer veröffentlichen

# Von Hand, nur von main (Klaus 2026-10-28). Baut den NSIS-Installer (unsigniert, pro Benutzer) und legt ein Release
# mit Installer, SHA256SUMS und latest.json an. Danach stellt pages.yml latest.json und den Installer unter
# windows/ auf der Pages-Adresse bereit (für Fassungen bis 2.28.2, die dort nachsehen). Ab 2.28.3 prüft die App über die
# Versionszeile auf Klaus' Server: mit „ja“ im Feld server legt der Job „server“ Setup und unterschriebene
# aktuell-windows.json nach https://family-projekt.de/updates/familienakte/ (Vorbild BookLedgerPro, Klaus 2026-10-28).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versions-Tag, etwa windows-v2.28.3
        required: true
        type: string
      server:
        description: 'Auch auf den Update-Server family-projekt.de legen (genau "ja")'
        required: false
        default: 'nein'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target
      - name: Tag prüfen
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^windows-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#windows-v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "Tag $TAG gibt es schon"; exit 1; fi
      - run: npm ci
      - run: npm ci --prefix windows
      - name: Gemeinsamen Pro-Tresor und lokale Engine prüfen
        run: node tools/native/test-pro-tresor-engine.mjs
      - run: npm run typecheck
      - run: npm run check
      - run: node windows/tools/version.mjs && node tools/native/test-windows.mjs
      - name: Web-App bauen (dist/ muss vor den Rust-Proben da sein, generate_context! liest frontendDist)
        run: node windows/tools/build-web.mjs
        env:
          FAMILIENAKTE_COMMIT: ${{ github.sha }}
      - name: Rust-Proben
        working-directory: windows/src-tauri
        run: cargo test --release
      - name: Installer bauen (NSIS)
        run: npm run tauri --prefix windows -- build --bundles nsis
        env:
          FAMILIENAKTE_COMMIT: ${{ github.sha }}
      - name: Installer, Prüfsummen, latest.json
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#windows-v}"
          mkdir -p release
          name="Familienakte-Windows-$version-x64-setup.exe"
          cp windows/src-tauri/target/release/bundle/nsis/*-setup.exe "release/$name"
          (cd release && sha256sum "$name" > SHA256SUMS)
          sha=$(cut -d' ' -f1 release/SHA256SUMS)
          size=$(stat -c %s "release/$name")
          node -e "require('fs').writeFileSync('release/latest.json', JSON.stringify({ version: '$version', tag: '$TAG', file: '$name', url: 'https://lausiklauskn-png.github.io/Meine-Familienakte/windows/$name', releaseUrl: 'https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name', sha256: '$sha', size: $size, commit: '$GITHUB_SHA', date: new Date().toISOString().slice(0,10) }, null, 2) + '\n')"
          cat release/latest.json
          {
            echo "Meine Familienakte für Windows $version (unsigniertes NSIS-Setup pro Benutzer), Quelle \`$GITHUB_SHA\`."
            echo
            echo "Installieren: Setup herunterladen und ausführen; über eine vorhandene Fassung einfach drüberinstallieren. Windows-SmartScreen: „Weitere Informationen → Trotzdem ausführen“ (unsigniert)."
            echo
            echo "SHA-256:"; echo '```'; cat release/SHA256SUMS; echo '```'
          } > release/notes.md
      - name: Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Familienakte Windows $TAG" --notes-file release/notes.md release/*.exe release/SHA256SUMS release/latest.json
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(ls release/*.exe | xargs -n1 basename)"

  server:
    needs: release
    if: inputs.server == 'ja'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup aus dem Release holen und prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p rel hoch
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel --pattern '*.exe' --pattern SHA256SUMS
          (cd rel && sha256sum -c SHA256SUMS)
          cp rel/*.exe hoch/
      - name: aktuell-windows.json bauen, unterschreiben, gegen den Schlüssel der App prüfen
        env:
          SIGNIERSCHLUESSEL: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNIERSCHLUESSEL" || { echo "::error::Geheimnis UPDATE_SIGNING_KEY fehlt"; exit 1; }
          node tools/native/update-feed.mjs windows hoch/*.exe hoch/aktuell-windows.json
          umask 077; printf '%s\n' "$SIGNIERSCHLUESSEL" > "$RUNNER_TEMP/sig.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/sig.pem" -in hoch/aktuell-windows.json -out "$RUNNER_TEMP/sig.bin"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > hoch/aktuell-windows.json.sig; echo >> hoch/aktuell-windows.json.sig
          rm -f "$RUNNER_TEMP/sig.pem"
          PUB=$(grep -o 'SCHLUESSEL: &str = "[^"]*"' windows/src-tauri/src/update.rs | cut -d'"' -f2)
          { echo '-----BEGIN PUBLIC KEY-----'; echo "$PUB"; echo '-----END PUBLIC KEY-----'; } > "$RUNNER_TEMP/pub.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/pub.pem" -in hoch/aktuell-windows.json -sigfile "$RUNNER_TEMP/sig.bin"
          ls -la hoch
      - name: Auf family-projekt.de hochladen und von außen prüfen
        env:
          HOCHLADESCHLUESSEL: ${{ secrets.UPDATE_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOCHLADESCHLUESSEL" || { echo "::error::Geheimnis UPDATE_UPLOAD_KEY fehlt"; exit 1; }
          umask 077; mkdir -p ~/.ssh; printf '%s\n' "$HOCHLADESCHLUESSEL" > ~/.ssh/upload
          # Server-Kennung fest (Klaus' Termux, 2026-10-28): eine fremde Gegenstelle bekommt nichts.
          echo '167.233.204.72 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIhzSmN0kY2Vk2oem2u6dH8rq04A8UXVZyay2WWRjOmR' > ~/.ssh/known_hosts
          # Nur Windows-Dateien abgleichen (alte Setups weg); Android-Dateien im selben Ordner bleiben unberührt.
          rsync -rt --delete-after --delay-updates --include='aktuell-windows.json' --include='aktuell-windows.json.sig' --include='Familienakte-Windows-*-x64-setup.exe' --exclude='*' \
            -e "ssh -i ~/.ssh/upload -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" hoch/ root@167.233.204.72:familienakte/
          rm -f ~/.ssh/upload
          B=https://family-projekt.de/updates/familienakte
          curl -fsS "$B/aktuell-windows.json" | cmp - hoch/aktuell-windows.json
          curl -fsS "$B/aktuell-windows.json.sig" | cmp - hoch/aktuell-windows.json.sig
          D=$(ls hoch/*.exe | xargs -n1 basename)
          curl -fsS "$B/$D" | sha256sum | grep -q "$(sha256sum "hoch/$D" | cut -d' ' -f1)"
          echo "Auf dem Update-Server: $B/$D"
